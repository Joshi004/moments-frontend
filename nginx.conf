# ============================================================
# Video Moments — Nginx Configuration
#
# Responsibilities:
#   1. Serve the React SPA static files
#   2. SPA routing — all non-file paths serve index.html
#   3. Reverse proxy /api/* and /health to the backend container
#   4. Gzip compression for text-based assets
#   5. Long-lived cache headers for hashed static assets
#
# Backend service is addressed as "backend" — the Docker Compose
# service name resolved via Docker's internal DNS.
# ============================================================

# Enable gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- React SPA routing ----
    # Try the exact file, then a directory index, then fall back to index.html
    # so that client-side routes (e.g. /videos/123) are handled by React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API reverse proxy ----
    # All /api/* requests are forwarded to the FastAPI backend.
    # proxy_read_timeout is set to 300s for long-running pipeline start requests
    # and video/clip streaming responses.
    location /api/ {
        proxy_pass http://backend:7005/api/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — pipeline operations are async (start returns quickly),
        # but large streaming responses from /api/videos/{id}/stream
        # and /api/clips/{id}/stream may run for several minutes.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;

        # Disable request buffering so streaming responses are forwarded
        # to the client immediately rather than buffered by Nginx.
        proxy_request_buffering off;
    }

    # ---- Health check proxy ----
    # /health lives at the backend root (not under /api/).
    # Used by Docker Compose healthcheck and monitoring tools.
    location /health {
        proxy_pass http://backend:7005/health;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout  10s;
        proxy_connect_timeout 5s;
    }

    # ---- Static asset caching ----
    # Create React App names all bundled JS/CSS files with a content hash
    # (e.g. main.a1b2c3d4.chunk.js), so these can be cached indefinitely.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Fall back to index.html if the hashed file is somehow missing
        try_files $uri =404;
    }

    # ---- Security headers ----
    add_header X-Content-Type-Options "nosniff"  always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header X-XSS-Protection        "1; mode=block" always;
}
